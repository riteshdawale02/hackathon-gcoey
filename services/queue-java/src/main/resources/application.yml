server:
  port: ${PORT:8080}

spring:
  application:
    name: queue-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:queue_db}}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
      initialization-fail-timeout: 0
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
  sql:
    init:
      mode: always
      continue-on-error: true

pulsequeue:
  jwt:
    secret: ${JWT_SECRET:pulsequeue_super_secret_jwt_key_2026}
  services:
    identity-url: ${IDENTITY_SERVICE_URL:http://localhost:5001}
