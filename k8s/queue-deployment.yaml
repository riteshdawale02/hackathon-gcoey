apiVersion: apps/v1
kind: Deployment
metadata:
  name: queue-service
  namespace: pulsequeue
  labels:
    app: queue-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: queue-service
  template:
    metadata:
      labels:
        app: queue-service
    spec:
      containers:
        - name: queue-java
          image: pulsequeue/queue-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: pulsequeue-config
                  key: JAVA_PORT
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: pulsequeue-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: pulsequeue-config
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: pulsequeue-config
                  key: QUEUE_DB_NAME
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: pulsequeue-secrets
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pulsequeue-secrets
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: pulsequeue-secrets
                  key: JWT_SECRET
            - name: IDENTITY_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: pulsequeue-config
                  key: IDENTITY_SERVICE_URL
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: queue-service
  namespace: pulsequeue
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: queue-service
