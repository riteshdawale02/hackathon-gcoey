apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pulsequeue-ingress
  namespace: pulsequeue
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/use-regex: "true"
    # AWS ALB Ingress Controller alternative annotations:
    # alb.ingress.kubernetes.io/scheme: internet-facing
    # alb.ingress.kubernetes.io/target-type: ip
    # alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
spec:
  rules:
    - http:
        paths:
          # Node.js Identity & Patient Service routes
          - path: /api/auth(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: identity-service
                port:
                  number: 5001
          - path: /api/patients(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: identity-service
                port:
                  number: 5001
          - path: /api/departments(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: identity-service
                port:
                  number: 5001

          # Java Queue Service routes
          - path: /api/queue(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: queue-service
                port:
                  number: 8080
          - path: /api/tokens(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: queue-service
                port:
                  number: 8080

          # React Frontend SPA
          - path: /(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
